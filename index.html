<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <title>源氏物語 — 桐壺篇 第一行專注學習</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
            background-color: #f6f0f7;
            color: #332233;
            margin: 0;
            padding: 40px 20px;
        }
        .main-card {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(92, 58, 108, 0.08);
            border: 1px solid #eadef0;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eadef0;
            padding-bottom: 15px;
        }
        h1 { margin: 0; color: #5c3a6c; font-size: 26px; letter-spacing: 2px; }
        p.subtitle { margin: 8px 0 0; color: #7d6387; font-size: 14px; }
        
        /* 播放控制區塊 */
        .player-control {
            background: #231924;
            color: #e2d9e5;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }
        .play-btn {
            background: #8e51a7;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .play-btn:hover { background: #aa6fc5; }
        .progress-bar {
            width: 70%;
            background: #443547;
            height: 6px;
            border-radius: 3px;
            margin: 10px auto 0;
            position: relative;
        }
        .progress-fill {
            background: #ba8bca;
            width: 0%;
            height: 100%;
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        /* 中文翻譯區塊 */
        .translation-box {
            background: #fcfaff;
            border-left: 5px solid #8e51a7;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 16px;
            color: #40204d;
            line-height: 1.6;
            font-weight: 500;
        }

        /* 逐詞拆解卡片排版 */
        .chunks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .word-card {
            background: #faf7fc;
            border: 1px solid #dfd3e3;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .word-card:hover { background: #fdfbfd; border-color: #ba8bca; }
        .word-card.highlight {
            background: #fff0be;
            border-color: #e6bd45;
            transform: scale(1.03);
            box-shadow: 0 6px 12px rgba(230, 189, 69, 0.25);
        }
        .word-ja { font-size: 18px; color: #111; font-weight: bold; margin-bottom: 8px; }
        .word-ja ruby { font-weight: bold; }
        .word-ja rt { font-size: 11px; color: #775582; font-weight: normal; }
        .word-zh { font-size: 13px; color: #555; line-height: 1.5; }
        
        /* 古典筆記區塊 */
        .note-box {
            background: #fff8e8;
            border: 1px solid #ffe3a8;
            padding: 15px;
            border-radius: 10px;
            font-size: 13.5px;
            color: #7c5a14;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="main-card">
    <header>
        <h1>🌸 源氏物語 — 桐壺（第一行）🌸</h1>
        <p class="subtitle">微觀字詞互動發音系統 — 精緻示範模型</p>
    </header>

    <!-- 播放模擬控制 -->
    <div class="player-control">
        <button class="play-btn" onclick="startLineAudio()">🔊 點擊播放日語語音</button>
        <div id="player-status">狀態：暫停中（點擊上方按鈕開始卡拉OK對齊）</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-indicator"></div>
        </div>
    </div>

    <!-- 中文翻譯 -->
    <div class="translation-box">
        <strong>中文意譯：</strong>在某一個天皇的朝代，有眾多女御與更衣侍奉著皇上，在這些人當中……
    </div>

    <!-- 詞性與字詞拆解 -->
    <div class="chunks-grid" id="chunks-container">
        <!-- 由 JavaScript 動態生成 -->
    </div>

    <!-- 古文備忘錄 -->
    <div class="note-box">
        💡 <strong>古典文法解析：</strong><br>
        1. <strong>『さぶらふ』</strong>：現代日文『お仕えする（侍奉）』的平安朝古語。它也是現代口語「サボる（偷懶）」的語源，非常有意思。<br>
        2. <strong>『ける』</strong>：過去助動詞『けり』的連體形，在古典文學中用來表達傳聞、過去，並自帶一種悠遠的詠嘆色彩。
    </div>
</div>

<script>
    // 桐壺第一行專屬的微觀字詞數據 (已修正語法錯誤)
    const lineData = {
        "text": "いづれの御時にか、女御、更衣あまたさぶらひたまひけるの中に",
        "duration": 8.5,
        "chunks": [
            { "word": "いづれの", "furigana": "いずれの", "zh": "哪一個、某一個（古典連體詞）", "time": 0.0 },
            { "word": "御時にか", "furigana": "おおときにか", "zh": "天皇的朝代吧（包含隱晦推測的古文結構）", "time": 1.2 },
            { "word": "女御・更衣", "furigana": "にょご・こうい", "zh": "女御與更衣（平安朝後宮妃子的品階，更衣地位較低）", "time": 3.0 },
            { "word": "あまた", "furigana": "", "zh": "許多、眾多（古語副詞，現代日文用「たくさん」）", "time": 4.8 },
            { "word": "さぶらひたまひける", "furigana": "さぶらいたまいける", "zh": "曾侍奉著（古語動詞「さぶらふ」＋最高級敬語型態）", "time": 5.8 },
            { "word": "の中に", "furigana": "のなかに", "zh": "的當中（空間與範圍的界定）", "time": 7.8 }
        ]
    };

    let playInterval = null;
    let clockTime = 0.0;

    document.addEventListener("DOMContentLoaded", () => {
        renderChunks();
        window.speechSynthesis.getVoices();
    });

    function speakJa(text) {
        window.speechSynthesis.cancel(); 
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ja-JP';
        msg.rate = 0.8; 
        window.speechSynthesis.speak(msg);
    }

    function renderChunks() {
        const container = document.getElementById("chunks-container");
        container.innerHTML = "";
        
        lineData.chunks.forEach((chunk, index) => {
            const card = document.createElement("div");
            card.className = "word-card";
            card.id = `card-${index}`;
            
            let jaText = chunk.furigana ? `<ruby>${chunk.word}<rt>${chunk.furigana}</rt></ruby>` : chunk.word;
            
            card.innerHTML = `
                <div class="word-ja">${jaText}</div>
                <div class="word-zh">${chunk.zh}</div>
            `;
            
            card.addEventListener("click", (e) => {
                e.stopPropagation();
                speakJa(chunk.word);
            });
            
            container.appendChild(card);
        });
    }

    function startLineAudio() {
        clearInterval(playInterval);
        window.speechSynthesis.cancel();
        
        speakJa(lineData.text);
        
        clockTime = 0.0;
        document.getElementById("player-status").innerText = "▶️ 語音導讀播放中，字詞同步高亮中...";
        
        playInterval = setInterval(() => {
            if (clockTime >= lineData.duration) {
                clearInterval(playInterval);
                document.getElementById("player-status").innerText = "⏹ nighttime 導讀結束（可點擊下方字卡進行個別聽讀）";
                document.getElementById("progress-indicator").style.width = "100%";
                document.querySelectorAll('.word-card').forEach(c => c.classList.remove('highlight'));
                return;
            }
            
            let percentage = (clockTime / lineData.duration) * 100;
            document.getElementById("progress-indicator").style.width = `${percentage}%`;
            
            let activeIdx = -1;
            for (let i = 0; i < lineData.chunks.length; i++) {
                if (clockTime >= lineData.chunks[i].time) {
                    activeIdx = i;
                }
            }
            
            lineData.chunks.forEach((_, idx) => {
                const card = document.getElementById(`card-${idx}`);
                if (card) {
                    if (idx === activeIdx) {
                        card.classList.add("highlight");
                    } else {
                        card.classList.remove("highlight");
                    }
                }
            });
            
            clockTime += 0.1;
        }, 100);
    }
</script>

</body>
</html>
