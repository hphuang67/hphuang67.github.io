<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日文智能雙軌陪伴與學習工具 (安全本地版)</title>
    <style>
        body {
            font-family: 'Segoe UI', Meiryo, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 { color: #00ecff; font-size: 28px; margin-bottom: 10px; }

        #mode-control {
            margin-bottom: 20px;
            background-color: #222222;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #444444;
        }
        #mode-control label {
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            color: #00ecff;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1300px;
            width: 100%;
            margin-top: 10px;
        }

        .left-panel {
            flex: 1;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            max-height: 75vh;
            overflow-y: auto;
        }
        .left-panel h3 { margin-top: 0; color: #bbb; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        video {
            width: 100%;
            border-radius: 12px;
            background: black;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        .segment-item {
            padding: 15px;
            margin-bottom: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            transition: all 0.2s;
        }
        .segment-item:hover { background: #3a3a3a; border-color: #00ecff; }

        .detail-box {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
            min-height: 250px;
        }
        
        .translation-text { font-size: 30px; color: #dddddd; line-height: 1.5; }
        .text-en { font-size: 22px; color: #00ecff; margin-top: 5px; display: none; }

        .cards-container { margin-top: 25px; text-align: center; }
        
        .chunk-card {
            display: inline-block;
            background: #f1c40f;
            color: black;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 16px;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .chunk-card rt { font-size: 20px; color: #2c3e50; font-weight: bold; padding-bottom: 4px; }

        .word-pop-explanation {
            margin-top: 15px;
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ff9f43;
            font-size: 22px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>日文影片線下自主學習工具</h1>

    <div id="mode-control">
        <input type="checkbox" id="userModeCheckbox">
        <label for="userModeCheckbox"> 🧑‍💻 開啟我的中英雙語進階學習模式 (包含單字解析與英文對照)</label>
    </div>
    
    <div class="container">
        <div class="left-panel">
            <h3>逐字稿分段（點擊播放與解析）</h3>
            <div id="segments-list"></div>
        </div>

        <div class="right-panel">
            <video id="mainVideo" controls>
                <source src="video.mkv" type="video/x-matroska">
            </video>
            
            <div class="detail-box">
                <div id="detail-content" style="font-size: 24px; color: #888;">請從左側點選任意段落開始陪伴媽媽唱歌...</div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        const video = document.getElementById('mainVideo');
        const listContainer = document.getElementById('segments-list');
        const detailContent = document.getElementById('detail-content');
        const checkbox = document.getElementById('userModeCheckbox');

        const songData = window.audiA5Data;
        let lastActiveItem = null;

        checkbox.addEventListener('change', () => {
            if (lastActiveItem) { showDetails(lastActiveItem); }
        });

        songData.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'segment-item';
            div.innerText = item.left_list_text;
            
            div.addEventListener('click', () => {
                video.currentTime = item.start_time_sec;
                video.play();
                lastActiveItem = item;
                showDetails(item);
            });
            listContainer.appendChild(div);
        });

        function showDetails(item) {
            detailContent.innerHTML = '';
            const transDiv = document.createElement('div');
            transDiv.className = 'translation-text';
            
            const zhLine = document.createElement('div');
            zhLine.innerText = `中文大意：${item.translation_zh}`;
            transDiv.appendChild(zhLine);

            const enLine = document.createElement('div');
            enLine.className = 'text-en';
            enLine.innerText = `English: ${item.translation_en}`;
            enLine.style.display = checkbox.checked ? 'block' : 'none';
            transDiv.appendChild(enLine);
            
            detailContent.appendChild(transDiv);

            const cardsDiv = document.createElement('div');
            cardsDiv.className = 'cards-container';
            
            item.right_details_chunks.forEach(chunk => {
                const cardWrapper = document.createElement('div');
                cardWrapper.style.display = 'inline-block';
                cardWrapper.style.textAlign = 'center';

                const ruby = document.createElement('ruby');
                ruby.className = 'chunk-card';
                ruby.innerHTML = `${chunk.word}<rt>${chunk.furigana}</rt>`;
                
                ruby.addEventListener('click', (e) => {
                    e.stopPropagation();
                    video.currentTime = chunk.time || item.start_time_sec;
                    video.play();
                });

                cardWrapper.appendChild(ruby);

                const expDiv = document.createElement('div');
                expDiv.className = 'word-pop-explanation';
                expDiv.innerHTML = `中：${chunk.zh}<br><span style="color:#00ecff">En: ${chunk.en}</span>`;
                expDiv.style.display = checkbox.checked ? 'block' : 'none';
                cardWrapper.appendChild(expDiv);

                cardsDiv.appendChild(cardWrapper);
            });
            
            detailContent.appendChild(cardsDiv);
        }
    </script>
</body>
</html>
